name: A skill gets something wrong
description: A step you can't carry out, a contradiction, a wrong handoff, a broken link, or an invented number.
title: "Defect: "
labels: ["skill-defect"]
body:
  - type: markdown
    attributes:
      value: |
        An agent that gives you a market benchmark, or a figure with no rule, math or recipe behind it, counts as a defect. The five kinds of number a skill may use are listed in [ROADMAP.md](https://github.com/808enzo/chappie/blob/main/ROADMAP.md#on-numbers).
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove email addresses, phone numbers, names, order and account IDs, and rows from CRM exports. Replace them with made-up values that keep the shape of the problem.
  - type: dropdown
    id: skills
    attributes:
      label: Skill
      description: Pick every skill involved.
      multiple: true
      options:
        - crm-program-design
        - scenario-map
        - segmentation
        - rfm-segments
        - list-building
        - martech-stack
        - welcome-and-activation
        - triggered-messages
        - repeat-purchase
        - lapse-and-winback
        - offer-design
        - promo-calendar
        - loyalty-program-design
        - loyalty-program-launch
        - personalization
        - email-program
        - email-copy
        - email-design
        - deliverability
        - onsite-capture
        - push-notifications
        - in-product-messaging
        - chat-and-bots
        - messaging-channels
        - transactional-messaging
        - contact-orchestration
        - consent-and-preferences
        - metric-definitions
        - experiments-and-holdouts
        - crm-reporting
        - program-audit-and-ops
        - voice-of-customer
        - b2b-lifecycle
        - b2b-retention
        - subscription-retention
        - Not sure which skill
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      description: Pick every kind that applies.
      multiple: true
      options:
        - A step can't be carried out as written
        - A step is missing
        - Two files contradict each other
        - A question goes to a neighboring skill that doesn't cover it
        - The agent gave a market benchmark or an unexplained number
        - A link is broken
        - Something else
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: File and section
      description: Optional if the problem showed up only in the agent's answer.
      placeholder: SKILL.md, under "Control metric"
  - type: textarea
    id: request
    attributes:
      label: What you asked the agent
      description: Your request, word for word. Leave this empty if you found the problem by reading the file.
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code 2.1, Claude Sonnet 5
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The agent's answer, or the text in the file that is wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the step, the handoff or the answer should have been, and why.
    validations:
      required: true
  - type: checkboxes
    id: pull-request
    attributes:
      label: Fixing it yourself
      options:
        - label: I plan to open a pull request for this. CONTRIBUTING.md says how.
